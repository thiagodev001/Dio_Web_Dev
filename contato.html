<body>
    <div class="wrapper">
        <div class="menu">
            <img src="img/logo.jpg">
            <ul>
                <li><a href="index.html">Principal</a></li>
                <li><a href="sobre.html">Sobre Nos</a></li>
                <li><a href="nossos.html">Nossos Horarios</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </div>

        <div class="main">
            <div class="header">
                <img src="img/contato.jpg">
            </div>
    
            <div class="content">
                <h1>Contato</h1>
                <hr>
                <p>Entre em contato : (11)12345678</p>
                <p>Endereco: Lorem Ipsum 777</p>
                <div id="cont">
                <fieldset>
                    <legend>Dados Pessoais</legend>
                        <form name="signup" method="POST" action="meusite.com/cadastro" target="_blank" autocomplete="on" onsubmit="alert('enviei');">
    
                            <div class="form-group">
                                <label for="name">Nome:</label>
                                <input type="text" id="name" name="name">
                            </div>

                            <div class="form-group">
                                <label for="mail">E-mail:</label>
                                <input type="email" id="mail" name="mail">
                            </div>

                            <div class="form-group">
                                <label for="sub">Assunto:</label>
                                <input type="text" id="sub" name="sub">
                            </div>

                            <div class="form-group">
                                <label for="mensagem">Sua Mensagem:</label>
                                <textarea id="mensagem" name="msg" rows="5" cols="30" placeholder="Digite aqui"></textarea>
                            </div>

                            <div class="form-buttons">
                                <button type="reset">Limpar</button>
                                <button type="submit">Enviar</button>
                            </div>

                        </form>
                </fieldset>
                
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.488756744072!2d-46.68472682548652!3d-23.586798162525707!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5744e0ebff5b%3A0x769bf4a32f914782!2sGoogle%20S%C3%A3o%20Paulo%20-%20Edif%C3%ADcio%20P%C3%A1tio%20Victor%20Malzoni!5e0!3m2!1spt-BR!2sbr!4v1793367322488!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            </div>
    
            <div class="footer">
                <p>&copy; Todos os direitos reservados a Top-Tier&reg;</p>
            </div>
        </div>
    </div>
</body>
